services:
  mysql:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE:      pos_db
      MYSQL_USER:          pos_user
      MYSQL_PASSWORD:      pos_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pos_user", "-ppos_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pos_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME:               "POS System"
      APP_ENV:                local
      APP_KEY:                ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75YY2zq/QzdcPTieQTEFfDew=}
      APP_DEBUG:              true
      APP_URL:                http://localhost:8000
      DB_CONNECTION:          mysql
      DB_HOST:                mysql
      DB_PORT:                3306
      DB_DATABASE:            pos_db
      DB_USERNAME:            pos_user
      DB_PASSWORD:            pos_secret
      CACHE_STORE:            redis
      SESSION_DRIVER:         redis
      QUEUE_CONNECTION:       redis
      REDIS_HOST:             redis
      REDIS_PORT:             6379
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      CORS_ALLOWED_ORIGINS:   http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
    command: >
      sh -c "
        composer install --no-interaction --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mysql_data:
  api_vendor:
  frontend_node_modules:
